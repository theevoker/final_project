<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<form action="/add_book/">
  <input type="text" placeholder="Add book.." name="book">
  <button type="submit">Submit</button>
</form>

<form action="/remove_book/">
  <input type="text" placeholder="Remove book.." name="book">
  <button type="submit">Submit</button>
</form>

<h1><br> {{ name }}</h1>
<p><br><br>{% for line in books %}
<a href="/remove_book/?book={{ line }}">  {{ line }}  </a>
<br />
{% endfor %}</p>


<br><br><br><br><br><br><br><br>

<form action="/developer/">
  <button type="submit">Developer options</button>
</form>

</body>
</html>
